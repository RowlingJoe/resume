# 失控风险管理系统
- project: 失控风险管理系统
  role: 软件开发工程师
  duration: 2026年4月1日 &mdash; 至今
  description: |
    <p><strong>技术栈：</strong>Claude Code、AI-Skills、AI-Code-Review、Vben Admin、Qiankun（微前端）、Vue3、TypeScript</p>
    <p><strong>项目职责：</strong></p>
    <ul class="resume-item-list">
      <li>敏捷演示与需求对齐：针对风控业务需求变更频繁的特点，负责快速迭代项目演示 Demo，利用 AI 工具链大幅缩短原型构建周期，加速业务方需求确认与产品方向对齐</li>
      <li>复杂逻辑攻坚：结合 Claude Code 强大的上下文理解能力，负责处理复杂的制程风险计算逻辑与数据可视化渲染，降低开发门槛并提升产出效率</li>
      <li>工程化规范建设：负责将 AI-Skills 与现有前端工程化体系深度融合，制定并推行适用于半导体风控业务的 AI 辅助开发规范，保障团队代码风格与架构的一致性</li>
      <li>系统稳定性保障：通过 AI-Code-Review 结合人工 Review 形成双重质量防线，负责排查并修复前端潜在隐患，保障系统在产线高压环境下的稳定运行</li>
    </ul>
    <p><strong>项目描述：</strong>该系统是专为芯片制造过程打造的核心风控平台，旨在实时监控、预警及管理制程中的各类错误风险。系统通过整合海量生产数据与复杂业务逻辑，帮助产线工程师快速定位异常节点，降低良率损失，保障芯片制造的安全与稳定。</p>
    <p><strong>技术成果：</strong></p>
    <ul class="resume-item-list">
      <li>研发效能显著提升：通过 AI-Skills 构建前端开发项目，将项目演示 Demo 的平均交付周期缩短约 40%，有效支撑了敏捷迭代节奏</li>
      <li>代码质量大幅改善：引入 AI-Code-Review 后，代码规范拦截率达到 95% 以上，上线后的前端基础缺陷率降低了约 30%</li>
      <li>复杂业务高效交付：借助 Claude Code 辅助重构与单元测试生成，核心风控模块的开发与测试耗时减少约 25%，保障了项目关键里程碑的按时交付</li>
      <li>AI 研发工具链沉淀：成功将 AI 编程助手融入日常研发流，沉淀了一套可复用的“AI 辅助前端开发最佳实践”，为团队后续的技术演进与效能提升提供了标准化参考</li>
    </ul>

# 刑事技术一体化实战应用平台
- project: 刑事技术一体化实战应用平台
  role: 开发经理
  duration: 2021.5 &mdash; 2025.12
  description: |
    <p><strong>项目描述：</strong>此项目是帮助刑事警察进行案件录入侦破的一体化平台。使用uaop为整体外部框架，内部由多个子系统构成（现勘、技术管理、质量管理、大屏、sso、质量检查等）。通过终端快勘快速将现场案情录入系统，再在平台对数据进行收集、整理、分析。实现对案件数据的全流程保存，数据挖掘，串并案分析，通过现场打点、多平台联动、指纹比对、在线签章、vr现场回看等辅助民警工作，同时还支撑公安部对各级单位的季度、年度考核任务等其他平台业务；平台已覆盖全国31个省市地区且系统出口至澳门、阿尔及利亚、智利等海外国家地区。</p>
    <p><strong>项目职责：</strong></p>
    <ul class="resume-item-list">
      <li>开发业务中的公共服务组件</li>
      <li>与三方开发人员进行外部业务的调试</li>
      <li>使用H5开发终端部分业务，减少终端业务操作</li>
      <li>分发组内开发任务并review组内代码</li>
      <li>带领研发组完成多个子系统的开发（现勘、串并分析、质量检查等）</li>
    </ul>
    <p><strong>技术成果：</strong></p>
    <ul class="resume-item-list">
      <li>性能优化：通过路由懒加载、组件异步加载、图片压缩等手段，首屏加载时间从4秒降至1.8秒</li>
      <li>实时通信：基于websocket实现案件消息实时推送，支持5000+并发连接</li>
      <li>地图交互：使用WebGL技术将案发现场地理位置相关信息在地图上进行自定义显示、统计各区域案件数量，进行不同地图层级的交互</li>
      <li>可视化大屏：使用echarts + d3.js构建多维度数据看板，提供10+种分析图表</li>
      <li>使用fabric.js技术将指纹比对软件在线化，增加系统集成度</li>
    </ul>

